# UI translations for FLwatch website
# 
# How to use:
#   {% assign t = site.data.translations %}
#   {% assign lang = page.lang | default: 'en' %}
#   {{ t[lang].labels.privacy | default: t.en.labels.privacy }}
#
# Structure:
#   - headings: section headings (e.g., Contents, Language, Legal)
#   - labels: short labels and link text (Privacy Policy, Impressum, etc.)
#   - buttons: button labels and aria text (Open/Close menu, theme toggle, CTAs)
#   - strings: longer phrases (subtitles, footer text, meta descriptions)
#   - brand: non-translated brand strings (kept for clarity, but same across locales)
#
# Notes:
#   - Keep German texts authoritative for legal pages; other locales should link to German originals as already implemented.
#   - English is the fallback for any missing key via Liquid's `default` filter.
#
